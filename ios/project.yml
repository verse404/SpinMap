name: SpinMap
options:
  bundleIdPrefix: com.spinmap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: en
targets:
  SpinMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpinMap
        excludes:
          - Info.plist
    info:
      path: SpinMap/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spinmap.cycling
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: SpinMap/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  SpinMapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpinMapTests
    dependencies:
      - target: SpinMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spinmap.cycling.tests
        CODE_SIGN_STYLE: Automatic
